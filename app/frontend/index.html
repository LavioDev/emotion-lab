<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="description" content="Phân tích cảm xúc câu tiếng Anh." />
    <title>Emotion Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <link href="/static/styles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="chat-app" aria-label="Emotion analysis chat">
      <header class="app-header">
        <div class="header-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M9 3v4m6-4v4m-6 10v4m6-4v4M3 9h4m-4 6h4m10-6h4m-4 6h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10 10h4v4h-4z" fill="currentColor" opacity=".78"/></svg>
        </div>
        <div class="header-copy">
          <h1>Emotion Chat</h1>
          <p>Phân tích cảm xúc câu tiếng Anh</p>
        </div>
        <span class="header-label">6 nhãn cảm xúc</span>
      </header>
      <div id="chat-messages" class="chat-messages" aria-live="polite" aria-relevant="additions">
        <div id="empty-state" class="empty-state">
          <div class="empty-state-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M9 3v4m6-4v4m-6 10v4m6-4v4M3 9h4m-4 6h4m10-6h4m-4 6h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10 10h4v4h-4z" fill="currentColor" opacity=".65"/></svg>
          </div>
          <p class="empty-state-title">Nhập câu để bắt đầu</p>
          <p class="empty-state-copy">Kết quả phân tích sẽ hiển thị tại đây.</p>
        </div>
      </div>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Nhập câu tiếng Anh</label>
        <textarea id="message-input" rows="1" maxlength="4000" placeholder="Viết một câu tiếng Anh để phân tích…" autocomplete="off" required></textarea>
        <div class="composer-bottom">
          <span class="composer-note"><span class="sparkle" aria-hidden="true">✦</span> Chỉ hỗ trợ phân loại câu tiếng Anh</span>
          <div class="composer-actions">
            <span id="char-count" class="char-count">0 / 4000</span>
            <button id="send-button" class="send-button" type="submit">
              <span id="send-label">Phân tích</span>
              <svg id="send-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 14-7-4.5 14-2.8-5.7L5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11.7 13.3 3.1-3.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span id="send-spinner" class="spinner hidden" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
